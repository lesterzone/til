<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6f3;
    --fg: #2a2a28;
    --muted: #6b6b66;
    --line: #d8d5cd;
    --dot: #b5895a;
    --card-bg: #ffffff;
    --card-border: #e6e3da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a17;
      --fg: #ece9e2;
      --muted: #9a9790;
      --line: #3a382f;
      --dot: #d3a06f;
      --card-bg: #242220;
      --card-border: #35332c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 6rem;
  }
  header {
    margin-bottom: 2.5rem;
  }
  header h1 {
    margin: 0 0 0.25rem;
    font-size: 1.75rem;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  #search {
    margin-top: 1.25rem;
    width: 100%;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--fg);
    font-size: 0.95rem;
  }
  #search:focus {
    outline: 2px solid var(--dot);
    outline-offset: 1px;
  }
  .year-heading {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 2.5rem 0 1rem;
  }
  .year-heading:first-of-type {
    margin-top: 0;
  }
  ol.timeline {
    list-style: none;
    margin: 0;
    padding: 0;
    border-left: 2px solid var(--line);
  }
  .entry {
    position: relative;
    padding: 0 0 1.5rem 1.5rem;
    margin-left: -2px;
  }
  .entry::before {
    content: "";
    position: absolute;
    left: -7px;
    top: 0.35rem;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--dot);
    border: 2px solid var(--bg);
  }
  .entry .date {
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 0.15rem;
  }
  .entry .title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .entry .description {
    color: var(--fg);
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .empty, .error {
    color: var(--muted);
    font-size: 0.95rem;
    padding: 1rem 0;
  }
  .error {
    color: #b5484b;
  }
  .error code {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Timeline</h1>
    <p>A personal log of events.</p>
    <input id="search" type="search" placeholder="Search title or description…">
  </header>
  <div id="timeline"></div>
</div>
<script src="app.js"></script>
</body>
</html>
